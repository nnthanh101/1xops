# tests/Taskfile.yml - local first: prove a change here, the way CI and a customer will, before anyone else sees it.
#   task gate   everything CI runs, then the customer's view, in order; stops at the first failure:
#               lint (ruff check + format check, as CI) → task test → act (the Release workflow's tests) →
#               the image (act cannot build it) → task ux. Run it before every answer that says "done" and
#               before every commit; `task release` runs it before anything is pushed.
#   task ux     build this tree, install it the customer's way in clean containers (non-root, no cloud account),
#               drive every command in a real terminal, check what tests cannot see, write tmp/ux/report.md and
#               one screenshot per run.
version: '3'

vars:
  # One image pair per folder: runs from two folders (or sessions) never test each other's build.
  TAG:
    sh: pwd | cksum | cut -d' ' -f1

tasks:
  gate:
    desc: '🚦 Local first: lint, tests, CI workflow, image, UX proof; stops at the first failure'
    summary: |
      Business value: what CI and a customer will see, proven on this machine before anyone else sees it.
      Scenario: run it before saying "done" and before every commit. `task release` runs it before anything is pushed.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: lint
      - task: test
      - echo "gate - act (the Release workflow's tests, as on a pull request; log in tmp/act-gate.log)"
      - mkdir -p tmp && act pull_request -W .github/workflows/release.yml --rm >tmp/act-gate.log 2>&1 || { tail -30 tmp/act-gate.log; exit 1; }
      - task: image
      - task: ux
      - |
        # the builder skills' cases, only when the plugin changed since the last release: advice for the release question
        last=$(git tag --list 'v*' --sort=-v:refname | head -1)
        if [ -n "$last" ] && git diff --quiet "$last" -- plugins/1xops; then echo "gate - evals skipped: plugins/1xops is as released in $last"
        else echo "gate - evals (advice, model runs; summary in tmp/evals/latest/summary.txt)"; bash scripts/evals.sh; fi
      - echo "gate - all passed. Look at tmp/ux/*.svg before calling it done."

  evals:
    desc: '🧪 Replay the builder skills'' cases as a member would: each case''s score and its gain over a run without the plugin'
    summary: |
      Business value: a skill that stops doing its job is caught before a release, not by a customer.
      Scenario: a wording change makes discover skip "show me the last time"; its case drops and the release question shows it.
      Model runs on your sign-in, stopped at MAX_USD; the report stays in tmp/evals/ and is never published.
      Usage: task evals [RUNS=1] [MAX_USD=15] [CASE='discover-*']
    dir: '{{.ROOT_DIR}}'
    cmds: ['RUNS={{.RUNS}} MAX_USD={{.MAX_USD}} CASE={{.CASE}} bash scripts/evals.sh']

  metrics:
    desc: '📈 Delivery measures: releases a week, lead time, change failure rate, time to restore'
    summary: |
      Business value: "continuous delivery" is a figure the board can check, not a slogan.
      Scenario: before the monthly review the owner reads how often releases ship and how often one needs a fix.
      Usage: task metrics [DAYS=90]
    dir: '{{.ROOT_DIR}}'
    cmds: ['DAYS={{.DAYS}} bash scripts/metrics.sh']

  member-proof:
    desc: '🧑‍💻 Prove a published release as a new member: install it fresh, then build and copy a plugin from synthetic inputs'
    summary: |
      Business value: every release is proven the way a customer meets it, without a person running the steps by hand.
      Scenario: after the owner approves a release, the same five cases run against what was published.
      Model runs on your sign-in; evidence stays in tmp/member-proof-VERSION/. Usage: task member-proof [V=x.y.z]
    dir: '{{.ROOT_DIR}}'
    cmds: ['bash scripts/member-proof.sh {{.V}}']

  lint:
    desc: '🧹 Style and format checks, exactly as CI runs them'
    summary: |
      Business value: no red build for a formatting rule.
      Scenario: CI once failed on the format check because the quick tests never ran it.
    dir: '{{.ROOT_DIR}}/packages/python'
    cmds:
      - uv run -q --group dev ruff check src tests
      - uv run -q --group dev ruff format --check src tests

  image:
    desc: '🐳 Build the container image and run it, as CI does'
    summary: |
      Business value: the container customers pull starts and reports the right version.
      Scenario: a first Dockerfile written from scratch was 386 MB, unpinned and unlocked; this build is measured every time.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - docker build -q --build-context repo=. -t 1xops:gate-{{.TAG}} packages/python >/dev/null
      - test "$(docker run --rm 1xops:gate-{{.TAG}} --version)" = "1xops $(grep -E '^version = ' packages/python/pyproject.toml | cut -d'"' -f2)"

  ux:
    desc: '🖥️  UX proof: every command in a real terminal, checked, with screenshots (tmp/ux)'
    summary: |
      Business value: what a person sees is verified, not only what the tests assert.
      Scenario: version 0.2.4 shipped a misaligned table while all 50 tests passed. Look at every tmp/ux/*.svg after a run.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - rm -rf tmp/ux && mkdir -p tmp/ux/pkg
      - uv build -q --project packages/python --out-dir tmp/ux/pkg
      - cd packages/npm && npm pack --silent --pack-destination ../../tmp/ux/pkg >/dev/null && rm -rf profiles LICENSE NOTICE
      - |
        docker build -q -t 1xops-ux:py-{{.TAG}} -f - tmp/ux/pkg >/dev/null <<'EOF'
        FROM ghcr.io/astral-sh/uv:python3.14-trixie-slim
        COPY *.whl /pkg/
        RUN UV_TOOL_DIR=/opt/uv-tools UV_TOOL_BIN_DIR=/usr/local/bin uv tool install -q /pkg/*.whl && install -d -o 1000 -g 1000 /work
        USER 1000:1000
        ENV HOME=/tmp/home
        WORKDIR /work
        EOF
      - |
        docker build -q -t 1xops-ux:js-{{.TAG}} -f - tmp/ux/pkg >/dev/null <<'EOF'
        FROM node:24-slim
        COPY *.tgz /pkg/
        RUN npm install -g --silent /pkg/*.tgz && install -d -o 1000 -g 1000 /work
        USER 1000:1000
        ENV HOME=/tmp/home
        WORKDIR /work
        EOF
      - UX_TAG={{.TAG}} uv run -q --project packages/python python scripts/ux_proof.py tmp/ux

  test:
    desc: '🧪 Quick tests: Python, Node.js, and that both print the same bytes'
    summary: |
      Business value: the two tools never disagree, so a customer gets the same result from either install.
      Scenario: a fix in one tool passes its own tests but changes what the other prints; this catches it.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - uv run --project packages/python --group dev pytest -q packages/python/tests
      - npm test --prefix packages/npm --silent
      # Python and Node.js print the same bytes, on this machine's real tools (a check that printed nothing fails)
      - mkdir -p tmp && uv run -q --project packages/python 1xops doctor >tmp/doctor-py.txt 2>&1; echo "exit $?" >>tmp/doctor-py.txt; node packages/npm/bin/1xops.mjs doctor >tmp/doctor-js.txt 2>&1; echo "exit $?" >>tmp/doctor-js.txt; test "$(wc -l <tmp/doctor-py.txt)" -gt 2 && cmp tmp/doctor-py.txt tmp/doctor-js.txt

  ci:
    desc: '🔁 The full check, as it runs on GitHub'
    summary: |
      Business value: a red CI run is reproduced on this machine before a fix is pushed.
      Scenario: CI fails on a pull request; run this to see the same failure locally.
    dir: '{{.ROOT_DIR}}'
    cmds: [act pull_request -W .github/workflows/release.yml --rm]
